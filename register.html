
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FixoServ | Register</title>

<link
rel="stylesheet"
href="css/register.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="css/mobile.css">

</head>

<body>

<div class="register-page">

    <!-- Left Panel -->

    <div class="left-panel">

        <div class="overlay">

            <h1>FIXOSERV</h1>

            <h2>

                Join FixoServ Today 🚀

            </h2>

            <p>

                Create your account and book professional home services anytime.

            </p>

        </div>

    </div>

    <!-- Right Panel -->

    <div class="right-panel">

        <form
        id="registerForm"
        class="register-card">

            <div class="logo">

                <i class="fa-solid fa-screwdriver-wrench"></i>

                <h2>FIXOSERV</h2>

            </div>

            <h1>

                Create Account

            </h1>

            <p>

                Register to continue

            </p>

            <!-- Full Name -->

            <div class="input-group">

                <i class="fa-solid fa-user"></i>

                <input

                    type="text"

                    id="fullName"

                    placeholder="Full Name"

                    required

                >

            </div>

            <!-- Email -->

            <div class="input-group">

                <i class="fa-solid fa-envelope"></i>

                <input

                    type="email"

                    id="email"

                    placeholder="Email Address"

                    required

                >

            </div>

            <!-- Phone -->

            <div class="input-group">

                <i class="fa-solid fa-phone"></i>

                <input

                    type="tel"

                    id="phone"

                    placeholder="Phone Number"

                    maxlength="10"

                    required

                >

            </div>

            <!-- Password -->

            <div class="input-group">

                <i class="fa-solid fa-lock"></i>

                <input

                    type="password"

                    id="password"

                    placeholder="Password"

                    required

                >

                <i

                class="fa-solid fa-eye"

                id="togglePassword"></i>

            </div>

                        <!-- Confirm Password -->

            <div class="input-group">

                <i class="fa-solid fa-shield-halved"></i>

                <input

                    type="password"

                    id="confirmPassword"

                    placeholder="Confirm Password"

                    required

                >

                <i

                class="fa-solid fa-eye"

                id="toggleConfirmPassword"></i>

            </div>

            <!-- Terms -->

            <div class="options">

                <label>

                    <input
                    type="checkbox"
                    id="terms"
                    required>

                    I agree to the

                    <a href="#">

                        Terms & Conditions

                    </a>

                </label>

            </div>

            <!-- Error -->

            <p

            id="registerError"

            class="error-message">

            </p>

            <!-- Register Button -->

            <button

                type="submit"

                id="registerBtn"

                class="register-btn">

                CREATE ACCOUNT

            </button>

            

          

            

            <div class="bottom-text">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </div>

        </form>

    </div>

</div>
<!-- ==========================
     LOADING SCREEN
========================== -->

<div id="loadingScreen" class="loading-screen">

    <div class="loader"></div>

    <p>Creating Account...</p>

</div>

<!-- ==========================
     REGISTER SCRIPT
========================== -->


<script type="module" src="js/register.js"></script>

</body>

</html>
